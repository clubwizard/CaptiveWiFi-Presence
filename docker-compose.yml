version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: captivewifi-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: captivewifi_landlord
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - captivewifi

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: captivewifi-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - captivewifi

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  captivewifi:
    driver: bridge
